[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Speler"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "colorlog",
    "crispy-bootstrap5",
    "curl_cffi",
    "Django",
    "django-crispy-forms",
    "django-filter",
    "django-tables2",
    "environs",
    "huggingface-hub",
    "mutagen",
    "Pillow",
    "requests",
    "plotly",
    "pylast",
    "retry",
    "simpleaudio",
    "unidecode",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-django",
]

[tool.setuptools]
packages = ["speler2"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "speler2.settings"
# the app keeps its tests in main/tests.py, which pytest does not collect by default
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.ruff]
# The minimum Python version to target, e.g., when considering automatic code upgrades,
# like rewriting type annotations
target-version = "py311"
# Exclude common directories that are typically not part of the source code or are generated by tools.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# 80 is for 80's monitors, and 120 is too large. 100 is also a good length for github PRs
line-length = 100
indent-width = 4
output-format = "grouped"


[tool.ruff.lint]
select = [
    "W",  # pycodestyle warnings (W)
    "E",  # pycodestyle errors (E)
    "D",  # pydocstyle (D)
    "F",  # Enable Pyflakes (F)
    "PL",  # pylint (PL)
    "I",  # isort (I)
    "N",  # pep8-naming (N)
#    "UP",  # pyupgrade (UP)
    "SIM",  # flake8-simplify (SIM)
    "B",  # flake8-bugbear (B)
    "S",  # flake8-bandit (S)
    "A",  # flake8-builtins (A)
    "PTH",  # flake8-use_pathlib (PTH)
    "PT",  # flake8-pytest (PT)
]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D104",  # Missing docstring in public package
    "D106",  # Missing docstring in public nested class
]
# Allow auto-fixing of all enabled rules when using the `--fix` option.
fixable = ["ALL"]
unfixable = [] # Specify rules that cannot be auto-fixed, if any.
extend-safe-fixes = []
extend-unsafe-fixes = []
# Define a regex pattern for allowed unused variables (typically underscore-prefixed).
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "D102",  # Missing docstring in public method
    "S101",  # Use of `assert` detected
    "PLR2004",  # Magic value used in comparison
    "PLC0415",  # `import` should be at the top-level of a file
]
"**/tests.py" = [
    "D102",  # Missing docstring in public method
    "S101",  # Use of `assert` detected
    "PLR2004",  # Magic value used in comparison
    "PLC0415",  # `import` should be at the top-level of a file
]
"**/models.py" = ["D105"]  # Missing docstring in magic method
"**/migrations/*" = [
    "E501",  # Line too long
    "PLC0415",  # `import` should be at the top-level of a file
]
"manage.py" = ["PLC0415"]  # Django convention: import inside main()
"**/fmt.py" = [
    "S308",  #  Use of `mark_safe` may expose cross-site scripting vulnerabilities
]

[tool.ruff.lint.pylint]
max-args = 13


[tool.ruff.lint.flake8-pytest-style]
# the pinned pre-commit ruff (v0.3.0) defaults to requiring the parentheses while
# newer ruff defaults to rejecting them; pin it so the two do not fight over the file
fixture-parentheses = true


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "native"
exclude = []
