{% load crispy_forms_tags %}

<span class="instrument" href="#" title="Set song as instrumental only"
      hx-get="{% url 'lyric_view' song.id %}?instrument=1"
      hx-trigger="click"
      hx-target="#lyrics-container"
      hx-swap="innerHTML">
        <i class="bi bi-music-note"></i>
</span>
<span class="refresh" href="#" title="Reload lyrics from AZLyrics"
      hx-get="{% url 'lyric_view' song.id %}?refresh=1"
      hx-trigger="click"
      hx-target="#lyrics-container"
      hx-swap="innerHTML">
        <i class="bi bi-arrow-clockwise"></i>
</span>

<div class="lyrics-font">
    {% if error %}

        <h6>Retry Fetching Lyrics</h6>
        <p>{{ error }}</p>
        <p><a href="{{ lookup_url }}" target="_blank">lookup song url...</a></p>
        {% crispy form %}

    {% else %}

        {{ lyrics|linebreaks }}

    {% endif %}
</div>
