{% load static %}
{% if skipped %}
    <p class="small text-warning ellipsis mb-0 flex-shrink-0">
        Skipped {% for name, artist in skipped %}<span class="title-font">{{ name }}</span>
        <em class="artist-font">{{ artist }}</em>{% if not forloop.last %}, {% endif %}{% endfor %}:
        no longer in the library
    </p>
{% endif %}
{% if match %}
    {% for song in match %}
        <a id="rating-box-{{ forloop.counter }}" class="text-reset text-decoration-none" href="#"
           hx-get="{% url 'next_rating' %}?winner_id={{ song.id }}"
           hx-target="#rating-container"
           hx-swap="innerHTML"
           hx-indicator="#rating-loader">
            <div class="card compact-card">
                <div class="card-body">
                    <h5 class="card-title title-font ellipsis">{{ song.name }}</h5>
                    <h6 class="card-subtitle text-muted artist-font">{{ song.artist.name }}</h6>
                </div>
            </div>
        </a>
    {% endfor %}
{% endif %}
