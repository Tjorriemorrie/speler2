{% load fmt %}

<div class="row">
    <div class="col">

        <h3>Similars</h3>
        <h6>Find similar artists to what you already listen to.</h6>

        <div class="row">

            <!-- HTMX will fill these three columns -->

            <div class="col-3" id="similars_missing_albums"
                 hx-get="{% url 'similars_missing_albums' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="spinner-border spinner-border-sm"></div>
            </div>

            <div class="col-4" id="similars_new_artists"
                 hx-get="{% url 'similars_new_artists' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="spinner-border spinner-border-sm"></div>
            </div>

            <div class="col-5" id="similars_bad_albums"
                 hx-get="{% url 'similars_bad_albums' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="spinner-border spinner-border-sm"></div>
            </div>

        </div>

    </div>
</div>
